name: Export Godot Project

on:
  push:
    tags:
      - "v*.*.*" # Triggers release automatically when you push a tag like v1.0.0
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Choose export target'
        required: true
        default: 'Windows'
        type: choice
        options:
          - 'Windows'
          - 'Linux'
          - 'Both'

permissions:
  contents: write # Needed to create GitHub Releases

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot 4.3 (Standard)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Rebuild UID cache & import assets
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --editor --quit || true

      # Step 1: Conditional Builds
      - name: Export Windows Desktop
        if: ${{ github.event.inputs.target_platform == 'Windows' || github.event.inputs.target_platform == 'Both' || github.event_name == 'push' }}
        run: |
          mkdir -p build/win
          godot --headless --export-release "Windows Desktop" build/win/TowerTetris.exe
          cd build/win && zip -r ../../TowerTetris-Windows.zip . && cd ../..

      - name: Export Linux
        if: ${{ github.event.inputs.target_platform == 'Linux' || github.event.inputs.target_platform == 'Both' }}
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/TowerTetris.x86_64
          cd build/linux && zip -r ../../TowerTetris-Linux.zip . && cd ../..

      # Step 2: Create Automatic GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || format('build-{0}', github.run_number) }}
          name: Release ${{ github.ref_name || format('Build #{0}', github.run_number) }}
          files: |
            TowerTetris-*.zip
