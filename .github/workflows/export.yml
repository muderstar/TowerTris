name: Export Godot Project

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot 4.3 (Standard)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          dotnet: false # Standard Godot build for GDScript
          include-templates: true

      - name: Import project & generate UID cache
        run: |
          # Import all resources and update uid_cache.bin
          godot --headless --import || true
          # Double pass in editor mode to flush UID path mapping to disk
          godot --headless --editor --quit || true

      - name: Export Linux + Windows
        run: |
          mkdir -p build
          godot --headless --export-release "Linux" build/TowerTetris.x86_64
          godot --headless --export-release "Windows Desktop" build/TowerTetris.exe

      - name: Show build sizes
        run: ls -lh build/

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: TowerTetris-Builds
          path: build/
          retention-days: 14
