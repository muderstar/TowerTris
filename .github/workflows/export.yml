name: Export Godot Project

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Choose export target'
        required: true
        default: 'Windows'
        type: choice
        options:
          - 'Windows'
          - 'Linux'
          - 'Both'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot 4.3 (Standard)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 原生引擎二进制已提交到仓库（rust/cold_clear_engine/native/），
      # 下面的 cargo/gcc 构建是"刷新"性质的：失败也不影响导出（使用仓库内已提交的二进制）。
      - name: Build ColdClear native engine (Linux, best-effort refresh)
        continue-on-error: true
        run: |
          cd rust/cold_clear_engine
          cargo build -p c-api --release || true
          cp -f target/release/libcold_clear.so native/libcold_clear.so || true
          gcc -O2 -o native/coldclear_worker_linux native/coldclear_worker_linux.c -ldl || true
          chmod +x native/coldclear_worker_linux || true

      - name: Build ColdClear native engine (Windows cross, best-effort)
        if: ${{ inputs.target_platform == 'Windows' || inputs.target_platform == 'Both' || github.event_name == 'push' }}
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 || true
          cd rust/cold_clear_engine
          rustup target add x86_64-pc-windows-gnu || true
          cargo build -p c-api --release --target x86_64-pc-windows-gnu || true
          cp -f target/x86_64-pc-windows-gnu/release/cold_clear.dll native/cold_clear.dll || true
          cp -f target/x86_64-pc-windows-gnu/release/cold_clear.dll.a native/cold_clear.lib || true
          x86_64-w64-mingw32-gcc -O2 -o native/coldclear_worker.exe native/coldclear_worker_linux.c || true

      - name: Rebuild UID cache & import assets
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --editor --quit || true

      - name: Export Windows Desktop
        if: ${{ inputs.target_platform == 'Windows' || inputs.target_platform == 'Both' || github.event_name == 'push' }}
        run: |
          mkdir -p build/win
          godot --headless --export-release "Windows Desktop" build/win/TowerTris.exe
          # 部署 ColdClear 原生引擎 sidecar（worker + dll 与可执行文件同目录）
          cp -f rust/cold_clear_engine/native/coldclear_worker.exe build/win/ || true
          cp -f rust/cold_clear_engine/native/cold_clear.dll build/win/ || true
          cd build/win && zip -r ../../TowerTris-Windows.zip . && cd ../..

      - name: Export Linux
        if: ${{ inputs.target_platform == 'Linux' || inputs.target_platform == 'Both' }}
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/TowerTris.x86_64
          # 部署 ColdClear 原生引擎 sidecar（worker + .so 与可执行文件同目录，保持可执行权限）
          cp -f rust/cold_clear_engine/native/coldclear_worker_linux build/linux/ || true
          cp -f rust/cold_clear_engine/native/libcold_clear.so build/linux/ || true
          chmod +x build/linux/coldclear_worker_linux || true
          cd build/linux && zip -r ../../TowerTris-Linux.zip . && cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Release Build #${{ github.run_number }}"
          files: |
            TowerTris-*.zip
